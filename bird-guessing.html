<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Knowledge Tree</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0f1117;
  --bg2: #181a24;
  --bg3: #1e2030;
  --bg4: #252839;
  --surface: #2a2d40;
  --border: #353953;
  --border2: #454a6b;
  --text: #e2e4f0;
  --text2: #a0a4c0;
  --text3: #6b70a0;
  --accent: #7c6ff7;
  --accent2: #9b8fff;
  --accent-bg: rgba(124,111,247,0.12);
  --green: #4ade80;
  --green-bg: rgba(74,222,128,0.12);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.12);
  --amber: #fbbf24;
  --amber-bg: rgba(251,191,36,0.12);
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* Header */
header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 1.4rem;
  color: var(--accent2);
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Buttons */
button {
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  border: none;
  outline: none;
  transition: all 0.15s;
}

.btn {
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 0.85rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover { background: var(--accent2); }

.btn-ghost {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }

.btn-danger {
  background: var(--red-bg);
  color: var(--red);
}
.btn-danger:hover { background: rgba(248,113,113,0.2); }

.btn-success {
  background: var(--green-bg);
  color: var(--green);
}

.btn-sm { padding: 5px 10px; font-size: 0.8rem; }

.btn-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}
.btn-icon:hover { background: var(--bg3); color: var(--text); }

/* Mode Toggle */
.mode-toggle {
  display: flex;
  background: var(--bg3);
  border-radius: var(--radius);
  padding: 3px;
  gap: 2px;
}

.mode-toggle button {
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text3);
  background: transparent;
}
.mode-toggle button.active {
  background: var(--accent);
  color: white;
}

/* Main Layout */
.app-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

/* Category Cards Grid */
.categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-top: 16px;
}

.category-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.category-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow); }
.category-card.locked { opacity: 0.5; cursor: not-allowed; }
.category-card.locked:hover { transform: none; box-shadow: none; }
.category-card.completed { border-color: var(--green); }

.category-card .lock-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15,17,23,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  z-index: 2;
}

.category-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.category-name {
  font-family: 'DM Serif Display', serif;
  font-size: 1.15rem;
  color: var(--text);
}

.category-badge {
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 500;
}

.category-desc {
  font-size: 0.85rem;
  color: var(--text2);
  margin-bottom: 14px;
  line-height: 1.5;
}

.category-progress {
  height: 4px;
  background: var(--bg4);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 8px;
}
.category-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
}
.category-card.completed .category-progress-fill { background: var(--green); }

.category-stats {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text3);
}

/* Section Headers */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  margin-top: 32px;
}

.section-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.5rem;
}

/* Quiz View */
.quiz-container {
  max-width: 700px;
  margin: 0 auto;
}

.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.quiz-image-area {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 20px;
  position: relative;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.quiz-image-area img {
  max-width: 100%;
  max-height: 500px;
  object-fit: contain;
  display: block;
}

.quiz-image-counter {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 500;
}

.quiz-image-caption {
  text-align: center;
  color: var(--text3);
  padding: 6px 12px 0;
  font-size: 0.78rem;
  font-style: italic;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.quiz-image-nav {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
}

.quiz-image-nav button {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  border: 1px solid rgba(255,255,255,0.15);
}
.quiz-image-nav button:hover { background: rgba(0,0,0,0.8); }

.quiz-input-area {
  position: relative;
  margin-bottom: 16px;
}

.quiz-input-area input {
  width: 100%;
  padding: 14px 18px;
  background: var(--bg2);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.15s;
}
.quiz-input-area input:focus { border-color: var(--accent); }
.quiz-input-area input.correct { border-color: var(--green); background: var(--green-bg); }
.quiz-input-area input.wrong { border-color: var(--red); background: var(--red-bg); }

.autocomplete-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-top: 4px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 50;
  display: none;
}
.autocomplete-dropdown.show { display: block; }

.autocomplete-item {
  padding: 10px 16px;
  font-size: 0.9rem;
  cursor: pointer;
  color: var(--text2);
}
.autocomplete-item:hover, .autocomplete-item.highlighted {
  background: var(--accent-bg);
  color: var(--text);
}

.quiz-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.autocomplete-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  color: var(--text3);
  cursor: pointer;
  user-select: none;
}
.autocomplete-toggle input { display: none; }
.autocomplete-toggle .toggle-track {
  width: 36px; height: 20px;
  background: var(--bg4);
  border-radius: 10px;
  position: relative;
  transition: background 0.2s;
}
.autocomplete-toggle input:checked + .toggle-track { background: var(--accent); }
.autocomplete-toggle .toggle-thumb {
  width: 16px; height: 16px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 2px; left: 2px;
  transition: transform 0.2s;
}
.autocomplete-toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(16px); }

/* Feedback / Confusion */
.quiz-feedback {
  margin-top: 16px;
  padding: 16px;
  border-radius: var(--radius);
  display: none;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.quiz-feedback.show { display: block; }
.quiz-feedback.correct { background: var(--green-bg); border: 1px solid rgba(74,222,128,0.3); }
.quiz-feedback.wrong { background: var(--red-bg); border: 1px solid rgba(248,113,113,0.3); }
.quiz-feedback.confusion { background: var(--amber-bg); border: 1px solid rgba(251,191,36,0.3); }

.feedback-title {
  font-weight: 700;
  margin-bottom: 6px;
  font-size: 0.95rem;
}
.quiz-feedback.correct .feedback-title { color: var(--green); }
.quiz-feedback.wrong .feedback-title { color: var(--red); }
.quiz-feedback.confusion .feedback-title { color: var(--amber); }

.feedback-text {
  font-size: 0.88rem;
  color: var(--text2);
  line-height: 1.6;
}

.confusion-images {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.confusion-images img {
  max-width: 200px;
  max-height: 150px;
  object-fit: cover;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}



/* Editor Styles */
.editor-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 16px;
}

.editor-panel h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.15rem;
  margin-bottom: 16px;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 6px;
}

.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }

.form-textarea { resize: vertical; min-height: 80px; }

.form-select option { background: var(--bg3); color: var(--text); }

.form-row {
  display: flex;
  gap: 12px;
}
.form-row > * { flex: 1; }

/* Image upload area */
.image-upload-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  color: var(--text3);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.image-upload-area:hover, .image-upload-area.dragover {
  border-color: var(--accent);
  background: var(--accent-bg);
  color: var(--text2);
}
.image-upload-area input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.image-url-input {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.image-thumbnails {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.image-thumb {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.image-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.image-thumb .remove-btn {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(248,113,113,0.9);
  color: white;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
}

.image-thumb-with-caption {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 80px;
}

.caption-input {
  width: 100%;
  padding: 3px 6px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.7rem;
  outline: none;
  text-align: center;
}
.caption-input:focus { border-color: var(--accent); }
.caption-input::placeholder { color: var(--text3); font-style: italic; }

/* Items list in editor */
.items-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.item-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg3);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.item-row .item-name { flex: 1; font-size: 0.9rem; }
.item-row .item-images-count { font-size: 0.78rem; color: var(--text3); }

/* Prereq tags */
.prereq-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.prereq-tag {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--accent-bg);
  color: var(--accent2);
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 500;
}
.prereq-tag .remove-prereq {
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  opacity: 0.7;
}
.prereq-tag .remove-prereq:hover { opacity: 1; }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: fadeIn 0.15s ease;
}
.modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  max-width: 600px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  animation: modalSlide 0.2s ease;
}
@keyframes modalSlide {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.3rem;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  justify-content: flex-end;
}

/* Confusion editor */
.confusion-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--bg3);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 8px;
}
.confusion-row .confusion-items {
  flex: 1;
  font-size: 0.88rem;
}
.confusion-row .confusion-items span { color: var(--amber); font-weight: 500; }

/* Back button */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text3);
  font-size: 0.88rem;
  cursor: pointer;
  padding: 6px 0;
  margin-bottom: 16px;
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
}
.back-link:hover { color: var(--text); }

/* No data placeholder */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text3);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
.empty-state p { font-size: 0.95rem; margin-bottom: 16px; }

/* Toast notifications */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 12px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.88rem;
  z-index: 300;
  animation: toastIn 0.25s ease;
  box-shadow: var(--shadow);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* GBIF progress bar */
.gbif-status { margin-top: 8px; font-size: 0.82rem; }
.gbif-status-ok { color: var(--green); }
.gbif-status-err { color: var(--red); }
.gbif-status-err a { color: var(--accent2); text-decoration: underline; }
.gbif-progress { margin-top: 8px; }
.gbif-progress-text { font-size: 0.8rem; color: var(--text2); margin-bottom: 6px; }
.gbif-progress-bar {
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
}
.gbif-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* GBIF autocomplete items in editor */
.gbif-ac-item { padding: 8px 12px !important; }
.gbif-ac-main { font-weight: 500; }
.gbif-ac-sub { font-size: 0.78rem; color: var(--text3); margin-top: 2px; }

/* Wikimedia photo picker */
.wiki-picker {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 8px 0;
  overflow: hidden;
}
.wiki-picker-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 0.84rem;
}
.wiki-picker-query { color: var(--text2); }
.wiki-picker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 6px;
  padding: 10px;
  max-height: 340px;
  overflow-y: auto;
}
.wiki-photo-card {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s;
}
.wiki-photo-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.wiki-photo-card:hover { border-color: var(--accent); }
.wiki-photo-card.selected { border-color: var(--green); }
.wiki-photo-check {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  border: 2px solid rgba(255,255,255,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}
.wiki-photo-card.selected .wiki-photo-check {
  background: var(--green);
  border-color: var(--green);
}
.wiki-photo-license {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 0.65rem;
  padding: 2px 6px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;

<body>

<header>
  <div class="logo">
    <div class="logo-icon">🌳</div>
    Knowledge Tree
  </div>
  <div class="header-actions">
    <div class="mode-toggle" id="modeToggle">
      <button class="active" data-mode="learn">Learn</button>
      <button data-mode="editor">Editor</button>
    </div>
    <button class="btn-icon" onclick="showImportExportModal()" title="Import / Export">⇅</button>
  </div>
</header>

<div class="app-container" id="appContainer"></div>

<!-- Modal container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/*
 * ╔══════════════════════════════════════════════════════════════════════════════╗
 * ║                         KNOWLEDGE TREE v1.0                                ║
 * ║                                                                            ║
 * ║  ⚠  UPDATE THIS COMMENT BLOCK WHENEVER FUNCTIONALITY CHANGES  ⚠           ║
 * ╚══════════════════════════════════════════════════════════════════════════════╝
 *
 * OVERVIEW
 * ────────
 * A single-file HTML/CSS/JS application for learning to recognize things
 * (birds, insects, trees, flags, etc.) through image-based quizzes. It doubles
 * as its own editor — the same file lets you create learning content and study it.
 *
 * FEATURES
 * ────────
 * • Tech-tree category system: categories can have prerequisite categories.
 *   Completing one category (reaching a configurable unlock threshold) unlocks
 *   others, similar to a tech tree in strategy games.
 *
 * • Image quiz: the user is shown one image at a time (randomized order) and
 *   must type the name. Supports multiple images per item (e.g., male/female
 *   dimorphism). User can cycle through images with prev/next buttons.
 *
 * • Fuzzy matching via Levenshtein distance: small typos are forgiven.
 *   Threshold scales with name length (≤1 for short, ≤2 for medium, ≤3 for long).
 *   Additionally, a toggleable autocomplete dropdown is available.
 *
 * • Confusion pairs: editor-authored explanations (with optional comparison
 *   images) that trigger when the user confuses two commonly mixed-up items.
 *   Bidirectional — if A↔B is defined, guessing A when B is correct (or vice
 *   versa) shows the same explanation.
 *
 * • Mastery tracking: each item has a 2-dot mastery indicator.
 *   - 0 correct guesses → "New" (empty dots)
 *   - 1 correct guess   → "Seen once" / in progress (1 amber dot)
 *   - 2+ correct guesses → "Learned" (2 green dots)
 *   Category unlock % is based on fully learned items (2+ correct).
 *
 * • Alt names: items can have alternative accepted names (e.g., common name +
 *   Latin name). Both exact and fuzzy matching apply to alt names.
 *
 * • Editor mode: create/edit/delete categories, items, and confusion pairs.
 *   Images can be added by drag-and-drop from PC, file picker, or pasting a URL.
 *   Dropped/selected files are converted to base64 via FileReader.
 *
 * • Import/Export:
 *   - JSON export/import for editing workflows (images stored as URLs or base64).
 *   - Standalone HTML export: produces a self-contained quiz-only HTML file with
 *     all data embedded in a <script type="application/json"> tag. Works offline.
 *     The exported file includes a minified copy of the quiz runtime (no editor).
 *
 * • Persistence: app data (categories, items, confusions) and user progress
 *   (per-item attempts/correct counts) are saved to localStorage.
 *
 * ARCHITECTURE
 * ────────────
 * The app is organized into these major sections:
 *
 * 1. CSS (in <style>)
 *    Dark theme with CSS custom properties. Responsive grid layout for category
 *    cards. Styles for quiz UI, editor forms, modals, mastery dots, stats bar.
 *
 * 2. HTML (in <body>)
 *    Minimal skeleton: header with mode toggle, a single #appContainer div that
 *    gets re-rendered by JS, and a modal overlay.
 *
 * 3. DATA MODEL (JS)
 *    - appData: the project's content (categories, items, confusions).
 *    - progress: per-item learning state { attempts, correct }.
 *    - State variables: currentMode, currentView, currentCategoryId, currentQuiz.
 *    - editCatState / editConfState: temporary state for editor forms.
 *
 * 4. UTILS (JS)
 *    Pure helper functions: uid generation, Levenshtein distance, string
 *    normalization, file-to-base64, array shuffle, toast notifications.
 *    Data accessors: getCatById, getItemById, getCategoryProgress, getItemMastery,
 *    isCategoryUnlocked, findConfusion, findItemByGuess, findClosestItemByGuess.
 *
 * 5. PERSISTENCE (JS)
 *    saveData() / loadData() — localStorage read/write for appData + progress.
 *
 * 6. RENDERING (JS)
 *    All UI is rendered by replacing #appContainer innerHTML. No framework.
 *    - render(): top-level router based on currentMode + currentView.
 *    - renderLearnHome(): category card grid with progress bars.
 *    - renderQuiz(): image display, input, autocomplete, feedback, mastery dots.
 *    - renderEditorHome(): editor category list + confusion pairs list.
 *    - renderEditCategory(): category form with items list.
 *    - renderEditItem(): item form with image upload/drag-and-drop.
 *    - renderEditConfusion(): confusion pair form.
 *
 * 7. QUIZ LOGIC (JS)
 *    startQuiz, prepareQuizItem, submitGuess (matching + confusion detection),
 *    nextQuizItem, image navigation, autocomplete filtering.
 *
 * 8. EDITOR LOGIC (JS)
 *    CRUD operations for categories, items, confusion pairs.
 *    New items use a staging pattern (_newItem) so canceling doesn't leave ghosts.
 *
 * 9. IMPORT/EXPORT (JS)
 *    JSON export/import, standalone HTML export (getQuizRuntime() returns a
 *    minified quiz-only JS runtime), blob download helper, reset functions.
 *
 * 10. INIT (JS)
 *     Checks for embedded data (standalone mode), loads from localStorage, renders.
 *
 * DATA SHAPES (keep in sync with code!)
 * ──────────
 * appData = {
 *   projectName: string,
 *   categories: [{
 *     id: string,
 *     name: string,
 *     description: string,
 *     items: [{
 *       id: string,
 *       name: string,
 *       images: ImageEntry[],          // see ImageEntry below
 *       altNames: string[]
 *     }],
 *     prerequisites: string[],         // array of category IDs
 *     unlockThreshold: number          // 0-100, default 80
 *   }],
 *   confusions: [{
 *     id: string,
 *     itemA: { catId: string, itemId: string },
 *     itemB: { catId: string, itemId: string },
 *     explanation: string,
 *     images: ImageEntry[]             // comparison images
 *   }]
 * }
 *
 * ImageEntry = string                  // legacy: bare URL or base64 data URL
 *            | { src: string,          // URL or base64 data URL
 *                caption: string }     // optional label e.g. "male", "juvenile", "forest habitat"
 *
 * progress = {
 *   [itemId: string]: {
 *     attempts: number,                // total guess count
 *     correct: number,                 // total correct guesses
 *     lastReviewedAt: number|null,     // timestamp (ms) of last review
 *     nextReviewAt: number|null,       // timestamp (ms) when item should next be reviewed
 *     interval: number,                // current SRS interval in days (starts at 1)
 *     easeFactor: number,              // SM-2 ease factor (starts at 2.5, min 1.3)
 *     history: number[]                // recent quality scores (0-5), newest last, max 20 kept
 *   }
 * }
 *
 * SRS NOTES (for future spaced repetition implementation):
 * - interval: days until next review. Doubles (approx) on correct, resets on wrong.
 * - easeFactor: multiplier that adjusts based on answer quality (SM-2 algorithm).
 *   Updated after each review: EF' = EF + (0.1 - (5-q) * (0.08 + (5-q) * 0.02))
 *   where q is quality 0-5. Currently we record q=5 for correct, q=1 for wrong.
 * - history: quality scores for the last 20 reviews. Enables streak detection,
 *   lapse tracking, and alternative scheduling algorithms.
 * - nextReviewAt: the quiz can use this to prioritize due items in the future.
 */

// ==================== DATA MODEL ====================
/** Default empty project structure, deep-copied on reset. */
const DEFAULT_DATA = {
  projectName: "My Knowledge Tree",
  categories: [],
  confusions: []
};

// Category shape: { id, name, description, items: [{id, name, images: (string|{src,caption})[], altNames:[]}], prerequisites: [catId], unlockThreshold: 80 }
// Confusion shape: { id, itemA: {catId, itemId}, itemB: {catId, itemId}, explanation: "", images: (string|{src,caption})[] }

/** Master content data — categories, items, confusions. Persisted to localStorage. */
let appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
/** Per-item learning progress. Keyed by item ID → { attempts: number, correct: number }. */
let progress = {};
/** Current app mode: 'learn' (quiz/browse) or 'editor' (create/edit content). */
let currentMode = 'learn';
/** Current view within the mode: 'home', 'quiz', 'editCategory', 'editItem', 'editConfusion'. */
let currentView = 'home';
/** ID of the category being quizzed or edited. Null when on home screen. */
let currentCategoryId = null;
/** Active quiz session state. Null when not quizzing. See startQuiz() for shape. */
let currentQuiz = null;

// ==================== UTILS ====================

/** Generates a short unique ID using timestamp + random suffix. Used for all entity IDs. */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/**
 * Computes the Levenshtein edit distance between two strings (case-insensitive).
 * Used to allow fuzzy matching of user guesses against correct answers.
 * @param {string} a - First string.
 * @param {string} b - Second string.
 * @returns {number} The minimum number of single-character edits (insertions, deletions, substitutions).
 */
function levenshtein(a, b) {
  a = a.toLowerCase(); b = b.toLowerCase();
  const m = a.length, n = b.length;
  const d = Array.from({length: m+1}, () => Array(n+1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(
        d[i-1][j] + 1,
        d[i][j-1] + 1,
        d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
      );
  return d[m][n];
}

/**
 * Returns the maximum allowed Levenshtein distance for a given item name.
 * Scales with name length so that longer names allow more typos.
 * @param {string} name - The correct item name.
 * @returns {number} Max tolerated edit distance (1, 2, or 3).
 */
function maxLevenshteinDist(name) {
  const len = name.length;
  if (len <= 4) return 1;
  if (len <= 8) return 2;
  return 3;
}

/** Normalizes a string for comparison: trims, lowercases, collapses whitespace. */
function normalize(s) { return s.trim().toLowerCase().replace(/\s+/g, ' '); }

/**
 * Extracts the image source URL from an ImageEntry (handles both legacy string
 * format and new {src, caption} object format for backward compatibility).
 * @param {string|Object} img - An image entry.
 * @returns {string} The image source URL or base64 data URL.
 */
function imgSrc(img) { return typeof img === 'string' ? img : img.src; }

/**
 * Extracts the caption from an ImageEntry. Returns empty string for legacy
 * string-only entries or entries without a caption.
 * @param {string|Object} img - An image entry.
 * @returns {string} The caption text, or ''.
 */
function imgCaption(img) { return (typeof img === 'object' && img.caption) ? img.caption : ''; }

/**
 * Reads a File object and returns a base64 data URL string.
 * Used when images are dragged/selected from the user's PC in the editor.
 * @param {File} file - The file to convert.
 * @returns {Promise<string>} A data URL (e.g., "data:image/png;base64,...").
 */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/**
 * Returns a new array with elements in random order (Fisher-Yates shuffle).
 * Used to randomize quiz item order and image display order within an item.
 * @param {Array} arr - The source array (not mutated).
 * @returns {Array} A new shuffled copy.
 */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Shows a temporary toast notification at the bottom-right of the screen.
 * Auto-removes after 3 seconds. Only one toast visible at a time.
 * @param {string} msg - The message to display.
 */
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

/** Looks up a category by its ID. Returns undefined if not found. */
function getCatById(id) { return appData.categories.find(c => c.id === id); }

/** Looks up an item within a specific category. Returns undefined if not found. */
function getItemById(catId, itemId) {
  const cat = getCatById(catId);
  return cat ? cat.items.find(i => i.id === itemId) : null;
}

/**
 * Computes learning progress for a category based on per-item mastery.
 * - "in progress" = exactly 1 correct guess.
 * - "learned" = 2 or more correct guesses.
 * - pct = percentage of learned items (used for unlock threshold checks).
 * @param {Object} cat - A category object.
 * @returns {{ pct: number, inProgress: number, learned: number, total: number }}
 */
function getCategoryProgress(cat) {
  if (!cat.items.length) return { pct: 0, inProgress: 0, learned: 0, total: cat.items.length };
  let inProgress = 0, learned = 0;
  cat.items.forEach(item => {
    const p = progress[item.id];
    if (p && p.correct >= 2) learned++;
    else if (p && p.correct === 1) inProgress++;
  });
  return { pct: Math.round((learned / cat.items.length) * 100), inProgress, learned, total: cat.items.length };
}

/**
 * Returns the mastery level for a single item: 0 (new), 1 (seen once), or 2 (learned).
 * Used to render the mastery dot indicators in the quiz UI.
 * @param {string} itemId - The item's unique ID.
 * @returns {number} 0, 1, or 2.
 */
function getItemMastery(itemId) {
  const p = progress[itemId];
  if (!p) return 0;
  return Math.min(p.correct, 2);
}

/**
 * Checks whether a category is unlocked. A category is unlocked if ALL of its
 * prerequisite categories have reached their respective unlock thresholds.
 * Categories with no prerequisites are always unlocked.
 * @param {Object} cat - A category object.
 * @returns {boolean}
 */
function isCategoryUnlocked(cat) {
  if (!cat.prerequisites || cat.prerequisites.length === 0) return true;
  return cat.prerequisites.every(preId => {
    const preCat = getCatById(preId);
    if (!preCat) return true;
    const prog = getCategoryProgress(preCat);
    return prog.pct >= (preCat.unlockThreshold || 80);
  });
}

/**
 * Finds a confusion pair between two items (bidirectional lookup).
 * @param {string} guessedItemId - The item the user (probably) meant.
 * @param {string} correctItemId - The item that was actually shown.
 * @returns {Object|undefined} The confusion object, or undefined if none defined.
 */
function findConfusion(guessedItemId, correctItemId) {
  return appData.confusions.find(c =>
    (c.itemA.itemId === guessedItemId && c.itemB.itemId === correctItemId) ||
    (c.itemA.itemId === correctItemId && c.itemB.itemId === guessedItemId)
  );
}

/**
 * Attempts to find which item the user was trying to name within a set of items.
 * First tries exact match (name + altNames), then picks the closest by Levenshtein.
 * Does NOT apply the distance threshold — always returns the closest match.
 * @param {string} guess - The user's raw input.
 * @param {Array} categoryItems - Items to search within.
 * @returns {Object|null} The best-matching item object.
 */
function findItemByGuess(guess, categoryItems) {
  const g = normalize(guess);
  for (const item of categoryItems) {
    if (normalize(item.name) === g) return item;
    if (item.altNames) {
      for (const alt of item.altNames) {
        if (normalize(alt) === g) return item;
      }
    }
  }
  // fuzzy match
  let best = null, bestDist = Infinity;
  for (const item of categoryItems) {
    const dist = levenshtein(g, normalize(item.name));
    if (dist < bestDist) { bestDist = dist; best = item; }
    if (item.altNames) {
      for (const alt of item.altNames) {
        const d = levenshtein(g, normalize(alt));
        if (d < bestDist) { bestDist = d; best = item; }
      }
    }
  }
  return best;
}

/**
 * Like findItemByGuess, but searches ALL items across ALL categories and
 * only returns a match if it's within the Levenshtein distance threshold.
 * Used to identify what the user likely meant when they guessed wrong, so
 * we can check for a relevant confusion pair.
 * @param {string} guess - The user's raw input.
 * @param {Array} allItems - All items across all categories.
 * @returns {Object|null} The matched item, or null if nothing is close enough.
 */
function findClosestItemByGuess(guess, allItems) {
  const g = normalize(guess);
  let best = null, bestDist = Infinity;
  for (const item of allItems) {
    const dist = levenshtein(g, normalize(item.name));
    if (dist < bestDist) { bestDist = dist; best = item; }
    if (item.altNames) {
      for (const alt of item.altNames) {
        const d = levenshtein(g, normalize(alt));
        if (d < bestDist) { bestDist = d; best = item; }
      }
    }
  }
  if (bestDist <= maxLevenshteinDist(best?.name || guess)) return best;
  return null;
}

// ==================== PERSISTENCE ====================

/** Writes appData and progress to localStorage. Called after any data mutation. */
function saveData() {
  try {
    localStorage.setItem('kt_data', JSON.stringify(appData));
    localStorage.setItem('kt_progress', JSON.stringify(progress));
  } catch(e) { console.warn('Save failed', e); }
}

/** Restores appData and progress from localStorage. Called once at init. */
function loadData() {
  try {
    const d = localStorage.getItem('kt_data');
    const p = localStorage.getItem('kt_progress');
    if (d) appData = JSON.parse(d);
    if (p) progress = JSON.parse(p);
  } catch(e) { console.warn('Load failed', e); }
}

// ==================== RENDERING ====================
// All views are rendered by replacing the innerHTML of #appContainer.
// This is a simple "re-render everything" approach — no virtual DOM or diffing.
const container = document.getElementById('appContainer');

/**
 * Top-level render router. Decides which view to render based on
 * currentMode ('learn'|'editor') and currentView ('home'|'quiz'|'editCategory'|etc).
 */
function render() {
  if (currentMode === 'learn') {
    if (currentView === 'quiz' && currentCategoryId) renderQuiz();
    else renderLearnHome();
  } else {
    if (currentView === 'editCategory') renderEditCategory();
    else if (currentView === 'editItem') renderEditItem();
    else if (currentView === 'editConfusion') renderEditConfusion();
    else renderEditorHome();
  }
}

// ==================== LEARN HOME ====================

/**
 * Renders the learn mode home screen: a grid of category cards split into
 * "Available" (unlocked) and "Locked" sections. Each card shows name,
 * description, progress bar, and stats (learned / in progress / total).
 */
function renderLearnHome() {
  currentView = 'home';
  const unlocked = appData.categories.filter(c => isCategoryUnlocked(c));
  const locked = appData.categories.filter(c => !isCategoryUnlocked(c));

  let html = '';
  if (appData.categories.length === 0) {
    html = `<div class="empty-state">
      <div class="empty-icon">🌱</div>
      <p>No categories yet. Switch to Editor mode to create your knowledge tree!</p>
      <button class="btn btn-primary" onclick="switchMode('editor')">Open Editor</button>
    </div>`;
  } else {
    if (unlocked.length) {
      html += `<div class="section-header"><h2 class="section-title">Available</h2></div>`;
      html += `<div class="categories-grid">`;
      unlocked.forEach(cat => {
        const prog = getCategoryProgress(cat);
        const isCompleted = prog.pct >= (cat.unlockThreshold || 80);
        html += `<div class="category-card ${isCompleted ? 'completed' : ''}" onclick="startQuiz('${cat.id}')">
          <div class="category-header">
            <div class="category-name">${esc(cat.name)}</div>
            ${isCompleted ? '<span class="category-badge btn-success">✓ Mastered</span>' : `<span class="category-badge" style="background:var(--accent-bg);color:var(--accent2);">${cat.items.length} items</span>`}
          </div>
          ${cat.description ? `<div class="category-desc">${esc(cat.description)}</div>` : ''}
          <div class="category-progress"><div class="category-progress-fill" style="width:${prog.pct}%"></div></div>
          <div class="category-stats">
            <span>${prog.learned} learned · ${prog.inProgress} in progress · ${prog.total} total</span>
          </div>
        </div>`;
      });
      html += `</div>`;
    }
    if (locked.length) {
      html += `<div class="section-header" style="margin-top:40px"><h2 class="section-title">Locked</h2></div>`;
      html += `<div class="categories-grid">`;
      locked.forEach(cat => {
        const prereqNames = (cat.prerequisites || []).map(pid => getCatById(pid)?.name || '?').join(', ');
        html += `<div class="category-card locked">
          <div class="lock-overlay">🔒</div>
          <div class="category-header">
            <div class="category-name">${esc(cat.name)}</div>
            <span class="category-badge" style="background:var(--bg4);color:var(--text3);">${cat.items.length} items</span>
          </div>
          ${cat.description ? `<div class="category-desc">${esc(cat.description)}</div>` : ''}
          <div class="category-stats"><span>Requires: ${esc(prereqNames)}</span></div>
        </div>`;
      });
      html += `</div>`;
    }
  }
  container.innerHTML = html;
}

/**
 * Initializes a quiz session for a given category. Shows an intro popup with

 * @param {string} catId - The category ID to quiz on.
 */
function startQuiz(catId) {

  const canUnlock = appData.categories.filter(c =>
    c.id !== catId && (c.prerequisites || []).includes(catId) && !isCategoryUnlocked(c)
  );

  const prog = getCategoryProgress(cat);

      </div>
      <div class="popup-stat-card">
        <div class="popup-stat-value">${prog.learned}</div>

        <div class="popup-stat-value">${prog.inProgress}</div>

        <div style="font-size:0.88rem;color:var(--text2)">${canUnlock.map(c => esc(c.name)).join(', ')}</div>

/**
 * Actually begins the quiz session after the intro popup is dismissed.
 * Separated from startQuiz so the popup can call this on button click.
 * @param {string} catId - The category ID.
 */
function beginQuiz(catId) {
  const cat = getCatById(catId);
  if (!cat) return;
  currentCategoryId = catId;
  currentView = 'quiz';

  // Snapshot currently unlocked category IDs so we can detect newly unlocked ones
  const unlockedBefore = new Set(appData.categories.filter(c => isCategoryUnlocked(c)).map(c => c.id));

  const items = shuffleArray(cat.items);
  currentQuiz = {
    catId,
    items,
    currentIndex: 0,
    imageIndex: 0,
    shuffledImages: [],
    sessionCorrect: 0,
    sessionTotal: 0,
    answered: false,
    autocomplete: true,
    unlockedBefore
  };
  prepareQuizItem();
  render();
}

/**
 * Prepares the current quiz item for display: resets image index,
 * shuffles the item's images into a random order, clears answered state.
 */
function prepareQuizItem() {
  if (!currentQuiz) return;
  const item = currentQuiz.items[currentQuiz.currentIndex];
  currentQuiz.imageIndex = 0;
  currentQuiz.shuffledImages = item.images.length > 0 ? shuffleArray(item.images) : [];
  currentQuiz.answered = false;
}

/**
 * Renders the quiz UI: stats bar (in progress / learned / remaining / attempts),
 * item mastery dots, image display with prev/next navigation, text input with
 * optional autocomplete, submit/next buttons, and feedback area.
 */
function renderQuiz() {
  const q = currentQuiz;
  const cat = getCatById(q.catId);
  const item = q.items[q.currentIndex];
  const images = q.shuffledImages;
  const img = images.length > 0 ? images[q.imageIndex] : null;
  const prog = getCategoryProgress(cat);
  const mastery = getItemMastery(item.id);
  const itemProg = progress[item.id];

  function dot(filled) {
    return `<span class="mastery-dot ${filled ? 'filled' : ''}"></span>`;
  }

  let html = `<div class="quiz-container">
    <button class="back-link" onclick="goHome()">← Back to categories</button>
    <div class="quiz-header">
      <h2 class="section-title">${esc(cat.name)}</h2>
    </div>
    <div class="quiz-stats-bar">
      <div class="quiz-stat"><span class="stat-dot" style="background:var(--amber)"></span> In progress: <strong>${prog.inProgress}</strong></div>
      <div class="quiz-stat"><span class="stat-dot" style="background:var(--green)"></span> Learned: <strong>${prog.learned}</strong></div>
      <div class="quiz-stat"><span class="stat-dot" style="background:var(--text3)"></span> Remaining: <strong>${prog.total - prog.learned - prog.inProgress}</strong></div>
    </div>
    <div class="quiz-item-status">
      Item ${q.currentIndex + 1}/${q.items.length}
      <span style="margin-left:8px">Mastery:</span>
      <span class="mastery-dots">${dot(mastery >= 1)}${dot(mastery >= 2)}</span>
      <span style="font-size:0.78rem;color:var(--text3)">${mastery === 0 ? 'New' : mastery === 1 ? 'Seen once' : 'Learned'}</span>
    </div>
    <div class="quiz-image-area" id="quizImageArea">
      ${img ? `<img src="${esc(imgSrc(img))}" alt="Identify this">` : '<div style="color:var(--text3);font-size:0.9rem;">No image available</div>'}
      ${images.length > 1 ? `
        <div class="quiz-image-counter">${q.imageIndex + 1} / ${images.length}</div>
        <div class="quiz-image-nav">
          <button onclick="quizPrevImage()">‹</button>
          <button onclick="quizNextImage()">›</button>
        </div>` : ''}
    </div>
    ${img && imgCaption(img) ? `<div class="quiz-image-caption">${esc(imgCaption(img))}</div>` : ''}
    <div class="quiz-input-area">
      <input type="text" id="quizInput" placeholder="What is this?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" name="quiz-answer-nofill"
        ${q.answered ? 'disabled' : ''}
        onkeydown="if(event.key==='Enter')submitGuess()"
        oninput="onQuizInput(event)">
      <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
    </div>
    <div class="quiz-controls">
      <button class="btn btn-primary" onclick="submitGuess()" ${q.answered ? 'disabled' : ''}>Submit</button>
      ${q.answered ? `<button class="btn btn-ghost" onclick="nextQuizItem()">Next →</button>` : ''}
      <div style="flex:1"></div>
      <label class="autocomplete-toggle">
        <input type="checkbox" ${q.autocomplete ? 'checked' : ''} onchange="toggleAutocomplete(this.checked)">
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        Autocomplete
      </label>
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
  </div>`;
  container.innerHTML = html;

  if (!q.answered) {
    setTimeout(() => document.getElementById('quizInput')?.focus(), 50);
  }
}

/** Advances to the next image for the current quiz item (wraps around). Updates in-place without full re-render. */
function quizNextImage() {
  if (!currentQuiz) return;
  currentQuiz.imageIndex = (currentQuiz.imageIndex + 1) % currentQuiz.shuffledImages.length;
  updateQuizImage();
}

/** Goes to the previous image for the current quiz item (wraps around). Updates in-place without full re-render. */
function quizPrevImage() {
  if (!currentQuiz) return;
  const len = currentQuiz.shuffledImages.length;
  currentQuiz.imageIndex = (currentQuiz.imageIndex - 1 + len) % len;
  updateQuizImage();
}

/**
 * Updates just the image, caption, and counter inside the quiz image area
 * without replacing the entire quiz container. Preserves scroll position,
 * input value, and focus state.
 */
function updateQuizImage() {
  const q = currentQuiz;
  if (!q) return;
  const images = q.shuffledImages;
  const img = images.length > 0 ? images[q.imageIndex] : null;
  const area = document.getElementById('quizImageArea');
  if (!area) return;

  // Update image
  const imgEl = area.querySelector('img');
  if (imgEl && img) {
    imgEl.src = imgSrc(img);
  }

  // Update caption (now rendered as sibling after quiz-image-area)
  let captionEl = area.nextElementSibling;
  if (captionEl && !captionEl.classList.contains('quiz-image-caption')) captionEl = null;
  const caption = img ? imgCaption(img) : '';
  if (caption) {
    if (!captionEl) {
      captionEl = document.createElement('div');
      captionEl.className = 'quiz-image-caption';
      area.insertAdjacentElement('afterend', captionEl);
    }
    captionEl.textContent = caption;
  } else if (captionEl) {
    captionEl.remove();
  }

  // Update counter
  const counterEl = area.querySelector('.quiz-image-counter');
  if (counterEl) {
    counterEl.textContent = (q.imageIndex + 1) + ' / ' + images.length;
  }
}

/** Toggles the autocomplete dropdown on/off for the current quiz session. */
function toggleAutocomplete(on) {
  if (currentQuiz) currentQuiz.autocomplete = on;
}

/**
 * Handles input events on the quiz text field. If autocomplete is enabled,
 * filters item names from ALL categories (not just the current one) by
 * substring match and shows a deduplicated dropdown. This way the user can't
 * narrow down answers by elimination from the autocomplete list.
 * Hides the dropdown when input is empty or only one exact match remains.
 */
function onQuizInput(e) {
  const q = currentQuiz;
  if (!q || !q.autocomplete || q.answered) {
    document.getElementById('autocompleteDropdown')?.classList.remove('show');
    return;
  }
  const val = normalize(e.target.value);
  const dropdown = document.getElementById('autocompleteDropdown');
  if (!val) { dropdown.classList.remove('show'); return; }

  // Search across ALL categories, not just the current one
  const allNames = [];
  appData.categories.forEach(cat => {
    cat.items.forEach(item => {
      allNames.push({ name: item.name, id: item.id });
      (item.altNames || []).forEach(alt => allNames.push({ name: alt, id: item.id }));
    });
  });

  const matches = allNames.filter(n => normalize(n.name).includes(val));
  // Deduplicate by name
  const seen = new Set();
  const unique = matches.filter(m => { const k = normalize(m.name); if (seen.has(k)) return false; seen.add(k); return true; });

  if (unique.length === 0 || (unique.length === 1 && normalize(unique[0].name) === val)) {
    dropdown.classList.remove('show');
    return;
  }

  dropdown.innerHTML = unique.slice(0, 8).map((m, i) =>
    `<div class="autocomplete-item" onmousedown="selectAutocomplete('${esc(m.name)}')">${esc(m.name)}</div>`
  ).join('');
  dropdown.classList.add('show');
}

/** Called when user clicks an autocomplete suggestion. Fills the input and hides dropdown. */
function selectAutocomplete(name) {
  const input = document.getElementById('quizInput');
  if (input) { input.value = name; }
  document.getElementById('autocompleteDropdown')?.classList.remove('show');
}

/**
 * Core quiz logic: evaluates the user's guess against the correct item.
 *
 * Matching strategy (in order):
 * 1. Exact match against item name (normalized).
 * 2. Exact match against any altName.
 * 3. Levenshtein fuzzy match against name (within threshold from maxLevenshteinDist).
 * 4. Levenshtein fuzzy match against altNames.
 *
 * On wrong answer: searches all items across all categories for what the user
 * likely meant (findClosestItemByGuess), then checks if a confusion pair exists
 * between that item and the correct one. If so, shows the authored explanation.
 *
 * Updates progress (attempts/correct), session counters, and re-renders feedback.
 */
function submitGuess() {
  const q = currentQuiz;
  if (!q || q.answered) return;
  const input = document.getElementById('quizInput');
  const guess = input?.value?.trim();
  if (!guess) return;

  q.answered = true;
  q.sessionTotal++;

  const cat = getCatById(q.catId);
  const correctItem = q.items[q.currentIndex];
  const guessNorm = normalize(guess);
  const correctNorm = normalize(correctItem.name);

  // Check exact match or alt names
  let isCorrect = guessNorm === correctNorm;
  if (!isCorrect && correctItem.altNames) {
    isCorrect = correctItem.altNames.some(a => normalize(a) === guessNorm);
  }

  // Check Levenshtein distance
  if (!isCorrect) {
    const dist = levenshtein(guessNorm, correctNorm);
    if (dist <= maxLevenshteinDist(correctItem.name)) isCorrect = true;
    if (!isCorrect && correctItem.altNames) {
      isCorrect = correctItem.altNames.some(a => levenshtein(guessNorm, normalize(a)) <= maxLevenshteinDist(a));
    }
  }

  // Update progress with SRS metadata
  if (!progress[correctItem.id]) {
    progress[correctItem.id] = {
      attempts: 0, correct: 0,
      lastReviewedAt: null, nextReviewAt: null,
      interval: 1, easeFactor: 2.5, history: []
    };
  }
  const prog = progress[correctItem.id];
  // Backfill SRS fields for legacy progress entries
  if (prog.interval === undefined) prog.interval = 1;
  if (prog.easeFactor === undefined) prog.easeFactor = 2.5;
  if (!prog.history) prog.history = [];

  prog.attempts++;
  prog.lastReviewedAt = Date.now();

  const feedback = document.getElementById('quizFeedback');
  input.classList.remove('correct', 'wrong');

  if (isCorrect) {
    q.sessionCorrect++;
    prog.correct++;
    // SRS: quality 5 (perfect recall) — update interval and ease factor
    const q5 = 5;
    prog.history.push(q5);
    if (prog.history.length > 20) prog.history.shift();
    prog.easeFactor = Math.max(1.3, prog.easeFactor + (0.1 - (5 - q5) * (0.08 + (5 - q5) * 0.02)));
    prog.interval = prog.correct === 1 ? 1 : prog.correct === 2 ? 3 : Math.round(prog.interval * prog.easeFactor);
    prog.nextReviewAt = Date.now() + prog.interval * 86400000;
    input.classList.add('correct');
    feedback.className = 'quiz-feedback show correct';
    feedback.innerHTML = `<div class="feedback-title">✓ Correct!</div><div class="feedback-text">That's <strong>${esc(correctItem.name)}</strong>.</div>`;
  } else {
    // SRS: quality 1 (wrong) — reset interval, lower ease factor
    const q1 = 1;
    prog.history.push(q1);
    if (prog.history.length > 20) prog.history.shift();
    prog.easeFactor = Math.max(1.3, prog.easeFactor + (0.1 - (5 - q1) * (0.08 + (5 - q1) * 0.02)));
    prog.interval = 1;
    prog.nextReviewAt = Date.now() + 86400000;
    input.classList.add('wrong');

    // Try to find what user meant for confusion matching
    const allItems = appData.categories.flatMap(c => c.items);
    const guessedItem = findClosestItemByGuess(guess, allItems);
    const confusion = guessedItem ? findConfusion(guessedItem.id, correctItem.id) : null;

    if (confusion) {
      feedback.className = 'quiz-feedback show confusion';
      let confHtml = `<div class="feedback-title">⚠ Common confusion!</div>
        <div class="feedback-text">You guessed <strong>${esc(guessedItem.name)}</strong>, but this is <strong>${esc(correctItem.name)}</strong>.<br><br>${esc(confusion.explanation)}</div>`;
      if (confusion.images && confusion.images.length > 0) {
        confHtml += `<div class="confusion-images">${confusion.images.map(img => `<img src="${esc(imgSrc(img))}">`).join('')}</div>`;
      }
      feedback.innerHTML = confHtml;
    } else {
      feedback.className = 'quiz-feedback show wrong';
      feedback.innerHTML = `<div class="feedback-title">✗ Not quite</div><div class="feedback-text">The correct answer is <strong>${esc(correctItem.name)}</strong>.</div>`;
    }
  }

  input.disabled = true;
  saveData();

  // Check for mastery celebration and newly unlocked categories
  if (isCorrect) {
    const catProg = getCategoryProgress(getCatById(q.catId));
    const newlyUnlocked = findNewlyUnlockedCategories(q.catId);
    // Update snapshot so popups don't retrigger for same unlocks within session
    if (newlyUnlocked.length > 0) {
      newlyUnlocked.forEach(c => q.unlockedBefore.add(c.id));
    }
    // Filter out already-celebrated unlocks (persisted across sessions)
    if (!progress._celebrations) progress._celebrations = { mastered: [], unlocked: [] };
    const unseenUnlocks = newlyUnlocked.filter(c => !progress._celebrations.unlocked.includes(c.id));

    if (catProg.pct >= 100 && !progress._celebrations.mastered.includes(q.catId)) {
      progress._celebrations.mastered.push(q.catId);
      unseenUnlocks.forEach(c => progress._celebrations.unlocked.push(c.id));
      saveData();
      setTimeout(() => showMasteryPopup(q.catId, unseenUnlocks), 600);
    } else if (unseenUnlocks.length > 0) {
      unseenUnlocks.forEach(c => progress._celebrations.unlocked.push(c.id));
      saveData();
      setTimeout(() => showUnlockPopup(unseenUnlocks), 600);
    }
  }

  // Re-render controls (show Next button) without wiping feedback
  const controls = document.querySelector('.quiz-controls');
  if (controls) {
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-ghost';
    nextBtn.textContent = 'Next →';
    nextBtn.onclick = nextQuizItem;
    controls.insertBefore(nextBtn, controls.querySelector('[style]'));
    controls.querySelector('.btn-primary').disabled = true;
  }
}

/**
 * Advances to the next quiz item. When all items have been shown,
 * reshuffles the list and starts over (infinite practice loop).
 */
function nextQuizItem() {
  const q = currentQuiz;
  if (!q) return;
  q.currentIndex++;
  if (q.currentIndex >= q.items.length) {
    // Reshuffle and restart
    q.items = shuffleArray(q.items);
    q.currentIndex = 0;
  }
  prepareQuizItem();
  renderQuiz();
}

/**
 * Finds categories that are now unlocked but weren't before this quiz session.
 * Compares against the unlockedBefore snapshot taken at quiz start.
 * @param {string} catId - The category that just had progress.
 * @returns {Object[]} Array of newly unlocked category objects.
 */
function findNewlyUnlockedCategories(catId) {
  const before = currentQuiz?.unlockedBefore || new Set();
  return appData.categories.filter(c =>
    c.id !== catId &&
    !before.has(c.id) &&
    isCategoryUnlocked(c)
  );
}

/**
 * Creates animated confetti particles inside the mastery popup.
 * Uses lightweight CSS-animated divs — no canvas or library needed.
 */
function spawnConfetti() {
  const container = document.getElementById('confettiContainer');
  if (!container) return;
  const colors = ['#7c6ff7', '#4ade80', '#fbbf24', '#f87171', '#38bdf8', '#a78bfa', '#fb923c'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.8 + 's';
    piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    const size = 4 + Math.random() * 6;
    piece.style.width = size + 'px';
    piece.style.height = size * (0.5 + Math.random()) + 'px';
    piece.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
    container.appendChild(piece);
  }
}
