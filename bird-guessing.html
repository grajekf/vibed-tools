// ==================== GBIF SPECIES LIST ====================

/**
 * Preconfigured species list definitions. Each entry maps a display label to a
 * GBIF higher taxon key. Currently only Birds (Aves, key 212).
 * To add more, append entries here — the rest is automatic.
 */
const GBIF_PRESETS = [
  { label: 'Birds (Aves)', key: 212 }
];

/** In-memory cache of loaded GBIF species lists. Keyed by GBIF taxon key. */
let gbifSpeciesCache = {};

/** Current download state for progress UI. Null when not downloading. */
let gbifDownloadState = null;

// ---- IndexedDB helpers ----

/**
 * Opens (or creates) the IndexedDB database for caching GBIF species data.
 * @returns {Promise<IDBDatabase>}
 */
function openGbifDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('KnowledgeTree_GBIF', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('species'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/**
 * Reads a cached species list from IndexedDB.
 * @param {number} taxonKey - The GBIF higher taxon key (e.g. 212 for Aves).
 * @returns {Promise<Object|null>} Cached entry { key, timestamp, species[] } or null.
 */
async function getGbifCache(taxonKey) {
  const db = await openGbifDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('species', 'readonly');
    const req = tx.objectStore('species').get(taxonKey);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

/**
 * Writes a species list to IndexedDB cache.
 * @param {number} taxonKey - The GBIF higher taxon key.
 * @param {Array} speciesList - Array of { gbifKey, scientific, namePl, nameEn }.
 */
async function setGbifCache(taxonKey, speciesList) {
  const db = await openGbifDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('species', 'readwrite');
    tx.objectStore('species').put({ key: taxonKey, timestamp: Date.now(), species: speciesList }, taxonKey);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ---- GBIF API fetching ----

const GBIF_BACKBONE_KEY = 'd7dddbf4-2cf0-4f39-9b2a-bb099caae36c';

/**
 * Fetches all SPECIES-rank accepted taxa under a higher taxon from GBIF backbone.
 * Paginates through the /species/search endpoint (300 per page to reduce load).
 * Implements exponential backoff with retry on HTTP 429 (rate limit) errors.
 * Extracts scientific name, Polish vernacular, English vernacular, and GBIF key.
 * Updates gbifDownloadState for progress bar rendering.
 *
 * @param {number} taxonKey - GBIF higher taxon key (e.g. 212 for Aves).
 * @returns {Promise<Array>} Array of { gbifKey, scientific, namePl, nameEn }.
 */
async function fetchGbifSpecies(taxonKey) {
  const PAGE_SIZE = 300;
  const BASE_DELAY = 1500;    // 1.5s between requests
  const MAX_RETRIES = 5;
  let offset = 0;
  let total = null;
  let allSpecies = [];

  gbifDownloadState = { taxonKey, loaded: 0, total: null, status: 'fetching', error: null, retrying: false, log: [] };
  renderEditCategory();

  function logEntry(msg) {
    const ts = new Date().toISOString();
    gbifDownloadState.log.push(`[${ts}] ${msg}`);
  }

  logEntry(`Starting download for taxonKey=${taxonKey}, pageSize=${PAGE_SIZE}`);

  while (true) {
    const url = `https://api.gbif.org/v1/species/search?datasetKey=${GBIF_BACKBONE_KEY}&rank=SPECIES&highertaxon_key=${taxonKey}&status=ACCEPTED&limit=${PAGE_SIZE}&offset=${offset}`;
    let data;
    let success = false;

    logEntry(`Fetching offset=${offset}`);

    for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
      try {
        const resp = await fetch(url);
        const hdrs = {};
        resp.headers.forEach((v, k) => { hdrs[k] = v; });

        if (resp.status === 429 || resp.status === 503) {
          // Rate limited or service unavailable — backoff and retry
          const retryAfter = resp.headers.get('Retry-After');
          const waitMs = retryAfter
            ? parseInt(retryAfter) * 1000
            : Math.min(BASE_DELAY * Math.pow(2, attempt + 1) + Math.random() * 1000, 60000);

          logEntry(`HTTP ${resp.status} at offset=${offset}, attempt=${attempt+1}/${MAX_RETRIES}, waiting ${Math.round(waitMs/1000)}s. Headers: ${JSON.stringify(hdrs)}`);

          gbifDownloadState.retrying = true;
          gbifDownloadState.retryWait = Math.round(waitMs / 1000);
          updateGbifProgressUI();

          await new Promise(r => setTimeout(r, waitMs));
          gbifDownloadState.retrying = false;
          continue;
        }

        if (resp.status === 404) {
          // Likely hit the GBIF offset limit — treat what we have as complete
          logEntry(`HTTP 404 at offset=${offset}. Likely offset limit reached. Treating ${allSpecies.length} species as complete. Headers: ${JSON.stringify(hdrs)}`);
          let body = '';
          try { body = await resp.text(); } catch(_) {}
          logEntry(`404 response body: ${body.substring(0, 500)}`);
          // Finish gracefully with what we have
          success = false;
          break;
        }

        if (!resp.ok) {
          let body = '';
          try { body = await resp.text(); } catch(_) {}
          logEntry(`HTTP ${resp.status} at offset=${offset}, attempt=${attempt+1}/${MAX_RETRIES}. Headers: ${JSON.stringify(hdrs)}. Body: ${body.substring(0, 500)}`);

          if (attempt === MAX_RETRIES - 1) {
            throw new Error(`HTTP ${resp.status}`);
          }
          const waitMs = BASE_DELAY * Math.pow(2, attempt) + Math.random() * 1000;
          gbifDownloadState.retrying = true;
          gbifDownloadState.retryWait = Math.round(waitMs / 1000);
          updateGbifProgressUI();
          await new Promise(r => setTimeout(r, waitMs));
          gbifDownloadState.retrying = false;
          continue;
        }

        logEntry(`OK offset=${offset}, status=${resp.status}`);
        data = await resp.json();
        success = true;
        break;
      } catch (e) {
        logEntry(`Error at offset=${offset}, attempt=${attempt+1}/${MAX_RETRIES}: ${e.message}`);
        if (attempt === MAX_RETRIES - 1) {
          gbifDownloadState.status = 'error';
          gbifDownloadState.error = e.message || 'Network error';
          gbifDownloadState.retrying = false;
          renderEditCategory();
          return allSpecies;
        }
        const waitMs = BASE_DELAY * Math.pow(2, attempt) + Math.random() * 1000;
        gbifDownloadState.retrying = true;
        gbifDownloadState.retryWait = Math.round(waitMs / 1000);
        updateGbifProgressUI();
        await new Promise(r => setTimeout(r, waitMs));
        gbifDownloadState.retrying = false;
      }
    }

    // If we got a 404 (offset limit), break out gracefully
    if (!success && allSpecies.length > 0) {
      logEntry(`Stopping pagination at offset=${offset} with ${allSpecies.length} species collected`);
      break;
    }
    if (!success) break;

    if (total === null) {
      total = data.count;
      gbifDownloadState.total = total;
      logEntry(`Total species reported by API: ${total}`);
    }

    for (const r of data.results) {
      const entry = {
        gbifKey: r.key || r.nubKey,
        scientific: r.canonicalName || r.scientificName || '',
        namePl: '',
        nameEn: ''
      };
      if (r.vernacularNames && r.vernacularNames.length) {
        for (const vn of r.vernacularNames) {
          if (vn.language === 'pol' && !entry.namePl) entry.namePl = vn.vernacularName;
          if (vn.language === 'eng' && !entry.nameEn) entry.nameEn = vn.vernacularName;
        }
      }
      allSpecies.push(entry);
    }

    offset += PAGE_SIZE;
    gbifDownloadState.loaded = allSpecies.length;
    updateGbifProgressUI();

    if (data.endOfRecords || offset >= total) break;

    // Polite delay between requests
    await new Promise(r => setTimeout(r, BASE_DELAY));
  }

  logEntry(`Download complete. Total species: ${allSpecies.length}`);
  gbifDownloadState.status = 'done';
  gbifDownloadState.loaded = allSpecies.length;

  // Cache in IndexedDB
  try {
    await setGbifCache(taxonKey, allSpecies);
  } catch (e) {
    console.error('Failed to cache GBIF data', e);
  }

  // Also keep in memory
  gbifSpeciesCache[taxonKey] = allSpecies;

  renderEditCategory();
  return allSpecies;
}

/**
 * Loads a GBIF species list: from memory cache, then IndexedDB, then fetches from API.
 * @param {number} taxonKey - GBIF higher taxon key.
 * @returns {Promise<Array>} Species list.
 */
async function loadGbifSpecies(taxonKey) {
  if (gbifSpeciesCache[taxonKey]) return gbifSpeciesCache[taxonKey];

  const cached = await getGbifCache(taxonKey);
  if (cached && cached.species) {
    gbifSpeciesCache[taxonKey] = cached.species;
    return cached.species;
  }

  return fetchGbifSpecies(taxonKey);
}

/**
 * Called when the preconfigured species list dropdown changes in the category editor.
 * Sets or clears the gbifListKey on the editCatState and triggers loading.
 * @param {string} val - The GBIF taxon key as string, or '' to clear.
 */
async function onGbifPresetChange(val) {
  if (!editCatState) return;
  if (!val) {
    delete editCatState.gbifListKey;
    renderEditCategory();
    return;
  }
  const key = parseInt(val);
  editCatState.gbifListKey = key;
  await loadGbifSpecies(key);
  renderEditCategory();
}

/**
 * Clears the preconfigured species list selection from the current category.
 */
function clearGbifPreset() {
  if (!editCatState) return;
  delete editCatState.gbifListKey;
  renderEditCategory();
}

/**
 * Updates the GBIF download progress UI in-place without re-rendering the
 * entire category form. Falls back to full re-render if the progress container
 * doesn't exist (e.g., after initial render).
 */
function updateGbifProgressUI() {
  const el = document.getElementById('gbifProgressContainer');
  if (!el) { renderEditCategory(); return; }
  const dl = gbifDownloadState;
  if (!dl) return;
  if (dl.status === 'fetching') {
    const pct = dl.total ? Math.round((dl.loaded / dl.total) * 100) : 0;
    const retryMsg = dl.retrying ? `<div style="color:var(--amber);font-size:0.78rem;margin-top:4px">⏳ Rate limited — retrying in ${dl.retryWait}s...</div>` : '';
    el.innerHTML = `<div class="gbif-progress">
      <div class="gbif-progress-text">Downloading species data... ${dl.total ? `${dl.loaded.toLocaleString()} / ${dl.total.toLocaleString()}` : 'starting...'}</div>
      <div class="gbif-progress-bar"><div class="gbif-progress-fill" style="width:${pct}%"></div></div>
      ${retryMsg}
    </div>`;
  } else if (dl.status === 'done') {
    const cached = gbifSpeciesCache[dl.taxonKey];
    el.innerHTML = `<div class="gbif-status gbif-status-ok">✓ ${cached ? cached.length.toLocaleString() : '?'} species loaded</div>`;
  } else if (dl.status === 'error') {
    el.innerHTML = `<div class="gbif-status gbif-status-err">✗ Download failed: ${esc(dl.error)}${dl.loaded ? ` (got ${dl.loaded} species so far)` : ''}.<br>
      <a href="#" onclick="event.preventDefault();fetchGbifSpecies(${dl.taxonKey})">Retry</a> · <a href="#" onclick="event.preventDefault();downloadGbifErrorReport()">Download error report</a></div>`;
  }
}

/**
 * Downloads a diagnostic text report with GBIF download logs, timestamps,
 * HTTP status codes, headers, and error details. Useful for debugging on mobile.
 */
function downloadGbifErrorReport() {
  const dl = gbifDownloadState;
  if (!dl) return;
  const lines = [
    '=== GBIF Download Error Report ===',
    `Generated: ${new Date().toISOString()}`,
    `User Agent: ${navigator.userAgent}`,
    `Taxon Key: ${dl.taxonKey}`,
    `Status: ${dl.status}`,
    `Error: ${dl.error || 'none'}`,
    `Species loaded: ${dl.loaded || 0}`,
    `Total reported by API: ${dl.total || 'unknown'}`,
    '',
    '=== Request Log ===',
    ...(dl.log || ['No log entries']),
    '',
    '=== End of Report ==='
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `gbif-error-report-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ==================== EDIT CATEGORY ====================

/**
 * Temporary state for the category editor form. Deep-copied from the real data
 * so changes can be discarded on cancel. Null when not editing.
 * Extra property _editItemIndex (number or -1) tracks which item is being edited.
 * Extra property _newItem holds a staging item that hasn't been committed yet.
 */
let editCatState = null;

/**
 * Opens the category editor. If catId is provided, edits that category;
 * otherwise creates a new one with defaults.
 * @param {string} [catId] - ID of existing category to edit, or undefined for new.
 */
function editCategory(catId) {
  const cat = catId ? getCatById(catId) : null;
  editCatState = cat ? JSON.parse(JSON.stringify(cat)) : {
    id: uid(), name: '', description: '', items: [], prerequisites: [], unlockThreshold: 80
  };
  gbifDownloadState = null;
  currentView = 'editCategory';
  render();

  // If category has a GBIF preset, ensure it's loaded into memory
  if (editCatState.gbifListKey && !gbifSpeciesCache[editCatState.gbifListKey]) {
    loadGbifSpecies(editCatState.gbifListKey).then(() => {
      if (currentView === 'editCategory') renderEditCategory();
    });
  }
}

/**
 * Renders the category edit form: name, description, unlock threshold,
 * prerequisite selector with tags, and a list of items with edit/delete buttons.
 */
function renderEditCategory() {
  const cat = editCatState;
  const isNew = !getCatById(cat.id);
  const otherCats = appData.categories.filter(c => c.id !== cat.id);

  let html = `<button class="back-link" onclick="cancelEdit()">← Back to editor</button>
    <div class="editor-panel">
      <h3>${isNew ? 'New Category' : 'Edit Category'}</h3>
      <div class="form-group">
        <label class="form-label">Preconfigured species list</label>
        <div style="display:flex;gap:8px;align-items:center">
          <select class="form-select" style="flex:1" onchange="onGbifPresetChange(this.value)" id="gbifPresetSelect">
            <option value="">-- None --</option>
            ${GBIF_PRESETS.map(p => `<option value="${p.key}" ${cat.gbifListKey === p.key ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}
          </select>
          ${cat.gbifListKey ? `<button class="btn btn-ghost btn-sm" onclick="clearGbifPreset()" title="Clear selection">×</button>` : ''}
        </div>
        <div id="gbifProgressContainer">
        ${(() => {
          if (!cat.gbifListKey) return '';
          const dl = gbifDownloadState;
          const cached = gbifSpeciesCache[cat.gbifListKey];
          if (cached) {
            return `<div class="gbif-status gbif-status-ok">✓ ${cached.length.toLocaleString()} species loaded</div>`;
          }
          if (dl && dl.taxonKey === cat.gbifListKey && dl.status === 'fetching') {
            const pct = dl.total ? Math.round((dl.loaded / dl.total) * 100) : 0;
            return `<div class="gbif-progress">
              <div class="gbif-progress-text">Downloading species data... ${dl.total ? `${dl.loaded.toLocaleString()} / ${dl.total.toLocaleString()}` : 'starting...'}</div>
              <div class="gbif-progress-bar"><div class="gbif-progress-fill" style="width:${pct}%"></div></div>
            </div>`;
          }
          if (dl && dl.taxonKey === cat.gbifListKey && dl.status === 'error') {
            return `<div class="gbif-status gbif-status-err">✗ Download failed: ${esc(dl.error)}.<br><a href="#" onclick="event.preventDefault();fetchGbifSpecies(${cat.gbifListKey})">Retry</a> · <a href="#" onclick="event.preventDefault();downloadGbifErrorReport()">Download error report</a></div>`;
          }
          return `<div class="gbif-status" style="color:var(--text3)">Loading cache...</div>`;
        })()}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Name</label>
        <input class="form-input" value="${esc(cat.name)}" oninput="editCatState.name=this.value" placeholder="e.g., Common European Ducks">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" oninput="editCatState.description=this.value" placeholder="Optional description...">${esc(cat.description || '')}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Unlock Threshold (%)</label>
          <input class="form-input" type="number" min="0" max="100" value="${cat.unlockThreshold || 80}" onchange="editCatState.unlockThreshold=parseInt(this.value)||80">
        </div>
        <div class="form-group">
          <label class="form-label">Add Prerequisite</label>
          <select class="form-select" onchange="addPrereq(this.value);this.value=''">
            <option value="">Select...</option>
            ${otherCats.filter(c => !(cat.prerequisites||[]).includes(c.id)).map(c =>
              `<option value="${c.id}">${esc(c.name)}</option>`
            ).join('')}
          </select>
        </div>
      </div>
      <div class="prereq-tags">
        ${(cat.prerequisites||[]).map(pid => {
          const pc = getCatById(pid);
          return `<span class="prereq-tag">${esc(pc?.name || '?')} <span class="remove-prereq" onclick="removePrereq('${pid}')">×</span></span>`;
        }).join('')}
      </div>
    </div>

    <div class="editor-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="margin-bottom:0">Items (${cat.items.length})</h3>
        <button class="btn btn-primary btn-sm" onclick="addNewItem()">+ Add Item</button>
      </div>
      <div class="items-list">
        ${cat.items.length === 0 ? '<div style="color:var(--text3);font-size:0.88rem;text-align:center;padding:20px">No items yet</div>' : ''}
        ${cat.items.map((item, i) => `
          <div class="item-row">
            <div class="item-name">${esc(item.name) || '<em style="color:var(--text3)">Unnamed</em>'}</div>
            <div class="item-images-count">${item.images.length} img${item.images.length !== 1 ? 's' : ''}</div>
            <button class="btn btn-ghost btn-sm" onclick="editItemInCat(${i})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="removeItemFromCat(${i})">×</button>
          </div>
        `).join('')}
      </div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      ${!isNew ? `<button class="btn btn-danger" onclick="deleteCategory('${cat.id}')">Delete Category</button>` : ''}
      <button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCategory()">Save Category</button>
    </div>`;
  container.innerHTML = html;
}

/** Adds a prerequisite category to the category being edited. */
function addPrereq(catId) {
  if (!catId || !editCatState) return;
  if (!editCatState.prerequisites) editCatState.prerequisites = [];
  if (!editCatState.prerequisites.includes(catId)) editCatState.prerequisites.push(catId);
  render();
}

/** Removes a prerequisite category from the category being edited. */
function removePrereq(catId) {
  if (!editCatState) return;
  editCatState.prerequisites = (editCatState.prerequisites||[]).filter(id => id !== catId);
  render();
}

/**
 * Creates a new item in staging (_newItem) and opens the item editor.
 * The item is NOT added to the category's items array until saveItem() is called.
 * This prevents ghost/empty items from appearing when the user cancels.
 */
function addNewItem() {
  if (!editCatState) return;
  const newItem = { id: uid(), name: '', images: [], altNames: [] };
  editCatState._newItem = newItem;
  editCatState._editItemIndex = -1; // sentinel for "new item"
  currentView = 'editItem';
  render();
}

/** Removes an item from the category being edited (by index). */
function removeItemFromCat(index) {
  if (!editCatState) return;
  editCatState.items.splice(index, 1);
  render();
}

/** Opens the item editor for an existing item at the given index. */
function editItemInCat(index) {
  editCatState._editItemIndex = index;
  currentView = 'editItem';
  render();
}

/**
 * Commits the editCatState to appData. If the category already exists (by ID),
 * updates it in place; otherwise appends it. Validates that name is non-empty.
 */
function saveCategory() {
  if (!editCatState) return;
  if (!editCatState.name.trim()) { showToast('Category name is required'); return; }
  const existing = appData.categories.findIndex(c => c.id === editCatState.id);
  delete editCatState._editItemIndex;
  delete editCatState._newItem;
  if (existing >= 0) {
    appData.categories[existing] = editCatState;
  } else {
    appData.categories.push(editCatState);
  }
  editCatState = null;
  saveData();
  currentView = 'home';
  render();
  showToast('Category saved');
}

/**
 * Deletes a category and cleans up: removes it from other categories' prerequisites,
 * removes any confusion pairs that reference items in this category.
 * Prompts for confirmation before proceeding.
 */
function deleteCategory(catId) {
  if (!confirm('Delete this category and all its items?')) return;
  appData.categories = appData.categories.filter(c => c.id !== catId);
  // Remove from prerequisites
  appData.categories.forEach(c => {
    c.prerequisites = (c.prerequisites||[]).filter(id => id !== catId);
  });
  // Remove related confusions
  appData.confusions = appData.confusions.filter(c =>
    c.itemA.catId !== catId && c.itemB.catId !== catId
  );
  editCatState = null;
  saveData();
  currentView = 'home';
  render();
  showToast('Category deleted');
}

/** Discards any unsaved changes and returns to the editor home screen. */
function cancelEdit() {
  editCatState = null;
  currentView = 'home';
  render();
}

// ==================== WIKIMEDIA PHOTO SEARCH ====================

/** State for the Wikimedia photo picker */
let wikiPhotoState = null;

/**
 * Determines the best search query for finding photos of the current item.
 * If the item has a gbifKey and we have the GBIF species cache, use the scientific name.
 * Otherwise, fall back to whatever is in the name input.
 * @returns {string} The search query.
 */
function getPhotoSearchQuery() {
  const item = getEditingItem();
  if (!item) return '';

  // If item came from GBIF, use scientific name (best for Wikimedia)
  if (item.gbifKey && editCatState?.gbifListKey && gbifSpeciesCache[editCatState.gbifListKey]) {
    const sp = gbifSpeciesCache[editCatState.gbifListKey].find(s => s.gbifKey === item.gbifKey);
    if (sp && sp.scientific) return sp.scientific;
  }

  // Check altNames for something that looks like a scientific name (two Latin words)
  const alts = item.altNames || [];
  for (const alt of alts) {
    if (/^[A-Z][a-z]+ [a-z]+$/.test(alt.trim())) return alt.trim();
  }

  // Fall back to input value or item name
  const nameInput = document.getElementById('itemNameInput');
  return (nameInput?.value || item.name || '').trim();
}

/**
 * Opens the photo search panel. Fetches images from Wikimedia Commons
 * matching the item's scientific or common name.
 */
async function openPhotoSearch() {
  const query = getPhotoSearchQuery();
  if (!query) { showToast('Enter a name first'); return; }

  wikiPhotoState = { query, results: [], loading: true, selected: new Set(), error: null };
  renderPhotoPicker();
  await searchWikimediaPhotos(query);
}

/**
 * Searches Wikimedia Commons for images matching the given query.
 * Uses the MediaWiki API with generator=search in the File namespace (ns=6).
 * Requests thumbnails at 400px for the picker grid + 800px URLs for actual use.
 * @param {string} query - Search query (scientific name preferred).
 */
async function searchWikimediaPhotos(query) {
  const url = `https://commons.wikimedia.org/w/api.php?action=query`
    + `&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(query)}&gsrlimit=20`
    + `&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=400`
    + `&format=json&origin=*`;

  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    const pages = data.query?.pages || {};
    const results = Object.values(pages)
      .filter(p => p.imageinfo && p.imageinfo.length)
      .map(p => {
        const ii = p.imageinfo[0];
        const meta = ii.extmetadata || {};
        // Build the 800px thumbnail URL from the thumburl pattern
        // Wikimedia thumb URLs end like: .../thumb/a/ab/File.jpg/400px-File.jpg
        // We replace the last /NNNpx- segment with /800px-
        const thumb400 = ii.thumburl || '';
        const thumb800 = thumb400.replace(/\/\d+px-([^\/]+)$/, '/800px-$1');
        return {
          pageId: p.pageid,
          title: p.title,
          thumb: thumb400,
          url800: thumb800,
          urlFull: ii.url || '',
          desc: (meta.ImageDescription?.value || '').replace(/<[^>]*>/g, '').substring(0, 120),
          author: (meta.Artist?.value || '').replace(/<[^>]*>/g, '').substring(0, 80),
          license: meta.LicenseShortName?.value || ''
        };
      })
      // Filter out SVGs, maps, icons etc — keep only photos
      .filter(r => /\.(jpg|jpeg|png|webp)/i.test(r.title));

    wikiPhotoState.results = results;
    wikiPhotoState.loading = false;
    wikiPhotoState.error = results.length === 0 ? 'No photos found. Try a different name.' : null;
  } catch (e) {
    wikiPhotoState.loading = false;
    wikiPhotoState.error = `Search failed: ${e.message}`;
  }
  renderPhotoPicker();
}

/**
 * Renders the photo picker grid inside the item editor.
 * Shows loading state, results grid with selection checkboxes, and action buttons.
 */
function renderPhotoPicker() {
  const el = document.getElementById('wikiPhotoPickerArea');
  if (!el || !wikiPhotoState) return;

  const st = wikiPhotoState;

  if (st.loading) {
    el.innerHTML = `<div class="wiki-picker">
      <div class="wiki-picker-header">
        <span class="wiki-picker-query">Searching: <b>${esc(st.query)}</b></span>
        <button class="btn btn-ghost btn-sm" onclick="closePhotoPicker()">×</button>
      </div>
      <div style="text-align:center;padding:30px;color:var(--text3)">Searching Wikimedia Commons...</div>
    </div>`;
    return;
  }

  if (st.error) {
    el.innerHTML = `<div class="wiki-picker">
      <div class="wiki-picker-header">
        <span class="wiki-picker-query">Search: <b>${esc(st.query)}</b></span>
        <button class="btn btn-ghost btn-sm" onclick="closePhotoPicker()">×</button>
      </div>
      <div style="text-align:center;padding:20px;color:var(--text3)">${esc(st.error)}</div>
      <div style="padding:0 12px 12px;display:flex;gap:8px">
        <input class="form-input" id="wikiSearchInput" value="${esc(st.query)}" placeholder="Try another search..." style="flex:1">
        <button class="btn btn-primary btn-sm" onclick="retryPhotoSearch()">Search</button>
      </div>
    </div>`;
    return;
  }

  const selCount = st.selected.size;
  el.innerHTML = `<div class="wiki-picker">
    <div class="wiki-picker-header">
      <span class="wiki-picker-query">Results for: <b>${esc(st.query)}</b></span>
      <button class="btn btn-ghost btn-sm" onclick="closePhotoPicker()">×</button>
    </div>
    <div class="wiki-picker-grid">
      ${st.results.map((r, i) => `
        <div class="wiki-photo-card ${st.selected.has(i) ? 'selected' : ''}" onclick="toggleWikiPhoto(${i})">
          <img src="${esc(r.thumb)}" loading="lazy" alt="">
          <div class="wiki-photo-check">${st.selected.has(i) ? '✓' : ''}</div>
          ${r.license ? `<div class="wiki-photo-license">${esc(r.license)}</div>` : ''}
        </div>
      `).join('')}
    </div>
    <div class="wiki-picker-footer">
      <div style="display:flex;gap:8px;align-items:center;flex:1">
        <input class="form-input" id="wikiSearchInput" value="${esc(st.query)}" placeholder="Search again..." style="flex:1;height:34px;font-size:0.82rem">
        <button class="btn btn-ghost btn-sm" onclick="retryPhotoSearch()">Search</button>
      </div>
      <button class="btn btn-primary btn-sm" onclick="addSelectedWikiPhotos()" ${selCount === 0 ? 'disabled' : ''}>
        Add ${selCount > 0 ? selCount + ' photo' + (selCount > 1 ? 's' : '') : 'selected'}
      </button>
    </div>
  </div>`;
}

/** Toggles selection of a photo in the wiki picker */
function toggleWikiPhoto(index) {
  if (!wikiPhotoState) return;
  if (wikiPhotoState.selected.has(index)) {
    wikiPhotoState.selected.delete(index);
  } else {
    wikiPhotoState.selected.add(index);
  }
  renderPhotoPicker();
}

/** Retries search with whatever is in the search input */
async function retryPhotoSearch() {
  const input = document.getElementById('wikiSearchInput');
  const query = input?.value?.trim();
  if (!query) return;
  wikiPhotoState = { query, results: [], loading: true, selected: new Set(), error: null };
  renderPhotoPicker();
  await searchWikimediaPhotos(query);
}

/** Closes the photo picker */
function closePhotoPicker() {
  wikiPhotoState = null;
  const el = document.getElementById('wikiPhotoPickerArea');
  if (el) el.innerHTML = '';
}

/**
 * Adds selected Wikimedia photos to the current item's images array.
 * Uses the 800px thumbnail URL. Stores author/license as caption.
 */
function addSelectedWikiPhotos() {
  if (!wikiPhotoState) return;
  const item = getEditingItem();
  if (!item) return;

  persistItemInputs();

  for (const idx of wikiPhotoState.selected) {
    const photo = wikiPhotoState.results[idx];
    if (!photo) continue;
    // Build attribution caption
    const caption = [photo.author, photo.license].filter(Boolean).join(' · ');
    item.images.push({ src: photo.url800, caption });
  }

  const count = wikiPhotoState.selected.size;
  closePhotoPicker();
  render();
  showToast(`Added ${count} photo${count > 1 ? 's' : ''}`);
}

/**

/**
 * Returns the item object currently being edited — either a staged new item
 * (when _editItemIndex === -1) or an existing item in the category's items array.
 * @returns {Object|null} The item being edited.
 */
function getEditingItem() {
  if (!editCatState) return null;
  if (editCatState._editItemIndex === -1) return editCatState._newItem;
  return editCatState.items[editCatState._editItemIndex];
}

/**
 * Handles input on the item name field. If the category has a GBIF species list,
 * shows an autocomplete dropdown searching by Polish name, English name, and
 * scientific name. Results show all three names for clarity.
 */
function onItemNameInput(e) {
  const cat = editCatState;
  const dropdown = document.getElementById('gbifItemDropdown');
  if (!dropdown) return;
  if (!cat || !cat.gbifListKey || !gbifSpeciesCache[cat.gbifListKey]) {
    dropdown.classList.remove('show');
    return;
  }
  const val = normalize(e.target.value);
  if (!val || val.length < 2) { dropdown.classList.remove('show'); return; }

  const list = gbifSpeciesCache[cat.gbifListKey];
  const matches = [];
  for (const sp of list) {
    if (matches.length >= 10) break;
    const sci = normalize(sp.scientific);
    const pl = normalize(sp.namePl || '');
    const en = normalize(sp.nameEn || '');
    if (pl.includes(val) || en.includes(val) || sci.includes(val)) {
      matches.push(sp);
    }
  }

  if (!matches.length) { dropdown.classList.remove('show'); return; }

  dropdown.innerHTML = matches.map(sp => {
    const displayName = sp.namePl || sp.scientific;
    const subtitle = [sp.scientific, sp.nameEn].filter(Boolean).filter(n => n !== displayName).join(' · ');
    return `<div class="autocomplete-item gbif-ac-item" onmousedown="selectGbifSpecies(${sp.gbifKey})">
      <div class="gbif-ac-main">${esc(displayName)}</div>
      ${subtitle ? `<div class="gbif-ac-sub">${esc(subtitle)}</div>` : ''}
    </div>`;
  }).join('');
  dropdown.classList.add('show');
}

/**
 * Called when user selects a species from the GBIF autocomplete.
 * Fills in the name (Polish preferred, then scientific) and alt names
 * (scientific + English). Also stores the GBIF key on the item.
 * @param {number} gbifKey - The GBIF usageKey of the selected species.
 */
function selectGbifSpecies(gbifKey) {
  const cat = editCatState;
  if (!cat || !cat.gbifListKey || !gbifSpeciesCache[cat.gbifListKey]) return;
  const sp = gbifSpeciesCache[cat.gbifListKey].find(s => s.gbifKey === gbifKey);
  if (!sp) return;

  const item = getEditingItem();
  if (!item) return;

  // Primary name: Polish, fallback to scientific
  item.name = sp.namePl || sp.scientific;

  // Alt names: scientific name always + English if available and different from primary
  const alts = [];
  if (sp.scientific && sp.scientific !== item.name) alts.push(sp.scientific);
  if (sp.nameEn && sp.nameEn !== item.name && sp.nameEn !== sp.scientific) alts.push(sp.nameEn);
  item.altNames = alts;
  item.gbifKey = sp.gbifKey;

  // Update DOM inputs directly without full re-render
  const nameInput = document.getElementById('itemNameInput');
  const altInput = document.getElementById('itemAltInput');
  if (nameInput) nameInput.value = item.name;
  if (altInput) altInput.value = item.altNames.join(', ');

  document.getElementById('gbifItemDropdown')?.classList.remove('show');
}

/**
 * Saves the current values from the item editor DOM inputs (name, altNames)
 * into the item object so they survive a re-render. Call before render().
 */
function persistItemInputs() {
  const item = getEditingItem();
  if (!item) return;
  const nameInput = document.getElementById('itemNameInput');
  const altInput = document.getElementById('itemAltInput');
  if (nameInput) item.name = nameInput.value.trim();
  if (altInput) item.altNames = (altInput.value || '').split(',').map(s => s.trim()).filter(Boolean);
}

/**
 * Processes files from drag-and-drop or file picker: converts each image file
 * to a base64 data URL and appends it as an ImageEntry {src, caption} to the
 * current item's images array.
 * @param {FileList} files - Files from an input or drop event.
 */
async function handleImageFiles(files) {
  const item = getEditingItem();
  if (!item) return;
  persistItemInputs();
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    try {
      const base64 = await fileToBase64(file);
      item.images.push({ src: base64, caption: '' });
    } catch(e) { console.error('Failed to read image', e); }
  }
  render();
}

/** Adds an image by URL to the current item's images array as {src, caption}. */
function addImageUrl() {
  const item = getEditingItem();
  if (!item) return;
  persistItemInputs();
  const input = document.getElementById('imageUrlInput');
  const url = input?.value?.trim();
  if (!url) return;
  item.images.push({ src: url, caption: '' });
  render();
}

/** Removes an image from the current item by index. */
function removeImage(index) {
  const item = getEditingItem();
  if (!item) return;
  persistItemInputs();
  item.images.splice(index, 1);
  render();
}

/**
 * Updates the caption for an image at the given index. Normalizes legacy string
 * entries to {src, caption} objects on the fly if needed.
 * @param {number} index - Image index within the item's images array.
 * @param {string} caption - The new caption text.
 */
function updateImageCaption(index, caption) {
  const item = getEditingItem();
  if (!item || !item.images[index]) return;
  // Normalize legacy string entry to object
  if (typeof item.images[index] === 'string') {
    item.images[index] = { src: item.images[index], caption: caption };
  } else {
    item.images[index].caption = caption;
  }
}

/**
 * Saves the item being edited. Reads name/altNames from DOM inputs.
 * If this is a new item (staged in _newItem), commits it to the category's
 * items array. Validates that name is non-empty.
 */
function saveItem() {
  const item = getEditingItem();
  if (!item) return;
  const nameInput = document.getElementById('itemNameInput');
  const altInput = document.getElementById('itemAltInput');
  item.name = nameInput?.value?.trim() || '';
  item.altNames = (altInput?.value || '').split(',').map(s => s.trim()).filter(Boolean);
  if (!item.name) { showToast('Item name is required'); return; }
  // If this was a new item, add it to the array now
  if (editCatState._editItemIndex === -1) {
    editCatState.items.push(item);
    delete editCatState._newItem;
  }
  backToEditCategory();
  showToast('Item saved');
}

/**
 * Navigates back from item editor to category editor.
 * For existing items: persists current input values (auto-save on navigate).
 * For new items: discards the staged _newItem (user must click Save explicitly).
 */
function backToEditCategory() {
  // Only persist field values for existing items (not new/cancelled ones)
  if (editCatState && editCatState._editItemIndex >= 0) {
    const item = editCatState.items[editCatState._editItemIndex];
    if (item) {
      const nameInput = document.getElementById('itemNameInput');
      const altInput = document.getElementById('itemAltInput');
      if (nameInput) item.name = nameInput.value.trim();
      if (altInput) item.altNames = (altInput.value || '').split(',').map(s => s.trim()).filter(Boolean);
    }
  }
  delete editCatState._editItemIndex;
  delete editCatState._newItem;
  currentView = 'editCategory';
  render();
}

  container.innerHTML = html;

  // Drag and drop for confusion images
  const dropZone = document.getElementById('confDropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleConfImageFiles(e.dataTransfer.files);
  });
}

/** Updates item A or B in the confusion pair when the dropdown selection changes. */
function onConfItemChange(side, val) {
  if (!editConfState) return;
  const [catId, itemId] = val.split('|');
  if (side === 'A') { editConfState.itemA = { catId, itemId }; }
  else { editConfState.itemB = { catId, itemId }; }
}

/** Processes image files for confusion pair comparison images (same as item images). */
async function handleConfImageFiles(files) {
  if (!editConfState) return;
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    try {
      const base64 = await fileToBase64(file);
      editConfState.images.push(base64);
    } catch(e) {}
  }
  render();
}

/** Adds an image URL to the confusion pair's comparison images. */
function addConfImageUrl() {
  if (!editConfState) return;
  const url = document.getElementById('confImageUrlInput')?.value?.trim();
  if (!url) return;
  editConfState.images.push(url);
  render();
}

/** Removes a comparison image from the confusion pair by index. */
function removeConfImage(i) {
  if (!editConfState) return;
  editConfState.images.splice(i, 1);
  render();
}

/** Commits the confusion pair to appData. Validates that both items are selected. */
function saveConfusion() {
  if (!editConfState) return;
  const expl = document.getElementById('confExplanation');
  if (expl) editConfState.explanation = expl.value.trim();
  if (!editConfState.itemA.itemId || !editConfState.itemB.itemId) {
    showToast('Select both items'); return;
  }
  const existing = appData.confusions.findIndex(c => c.id === editConfState.id);
  if (existing >= 0) appData.confusions[existing] = editConfState;
  else appData.confusions.push(editConfState);
  editConfState = null;
  saveData();
  currentView = 'home';
  render();
  showToast('Confusion pair saved');
}

/** Deletes a confusion pair after confirmation. */
function deleteConfusion(id) {
  if (!confirm('Delete this confusion pair?')) return;
  appData.confusions = appData.confusions.filter(c => c.id !== id);
  editConfState = null;
  saveData();
  currentView = 'home';
  render();
  showToast('Confusion pair deleted');
}

/** Discards unsaved confusion pair changes and returns to editor home. */
function cancelConfEdit() {
  editConfState = null;
  currentView = 'home';
  render();
}

// ==================== IMPORT / EXPORT ====================

/** Opens the import/export modal with buttons for JSON export/import, HTML export, and resets. */
function showImportExportModal() {
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">Import / Export</div>
      <button class="btn-icon" onclick="closeModal()">×</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <button class="btn btn-ghost" onclick="exportJSON()" style="justify-content:center;padding:14px">
        📄 Export as JSON
      </button>
      <div style="border-top:1px solid var(--border);margin:8px 0"></div>
      <button class="btn btn-ghost" onclick="document.getElementById('importFileInput').click()" style="justify-content:center;padding:14px">
        📥 Import JSON
      </button>
      <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importJSON(this.files[0])">
      <div style="border-top:1px solid var(--border);margin:8px 0"></div>
      <button class="btn btn-danger" onclick="resetProgress()" style="justify-content:center;padding:14px">
        🔄 Reset Learning Progress
      </button>
      <button class="btn btn-danger" onclick="resetAll()" style="justify-content:center;padding:14px">
        ⚠ Reset Everything
      </button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
}

/** Hides the modal overlay. */
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/** Exports appData as a downloadable .json file. Images are stored as-is (URLs or base64). */
function exportJSON() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `${appData.projectName || 'knowledge-tree'}.json`);
  closeModal();
  showToast('JSON exported');
}

/**
 * Imports a .json file and replaces the current appData. Basic validation checks
 * that the file has a 'categories' array. Does not merge — full replacement.
 */
function importJSON(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.categories) throw new Error('Invalid format');
      appData = data;
      saveData();
      render();
      closeModal();
      showToast('Data imported successfully');
    } catch(e) {
      showToast('Invalid JSON file');
    }
  };
  reader.readAsText(file);
}

/**
 * Triggers a file download in the browser by creating a temporary <a> element.
 * @param {Blob} blob - The file content.
 * @param {string} filename - The suggested download filename.
 */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/** Clears all learning progress but keeps categories/items/confusions intact. */
function resetProgress() {
  if (!confirm('Reset all learning progress? Your categories and items will be kept.')) return;
  progress = {};
  saveData();
  closeModal();
  render();
  showToast('Progress reset');
}

/** Nuclear reset: clears all data (categories, items, confusions) AND progress. */
function resetAll() {
  if (!confirm('Delete ALL data including categories, items, and progress?')) return;
  appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  progress = {};
  saveData();
  closeModal();
  render();
  showToast('All data reset');
}

// ==================== HTML ESCAPE ====================

/**
 * Escapes a string for safe insertion into HTML. Uses the browser's own
 * text encoding via a temporary div element to prevent XSS.
 * @param {string} s - Raw string.
 * @returns {string} HTML-safe string.
 */
function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ==================== MODE SWITCHING ====================

/**
 * Switches between 'learn' and 'editor' modes. Resets all transient state
 * (current view, quiz session, editor forms) and updates the toggle UI.
 * @param {string} mode - Either 'learn' or 'editor'.
 */
function switchMode(mode) {
  currentMode = mode;
  currentView = 'home';
  currentCategoryId = null;
  currentQuiz = null;
  editCatState = null;
  editConfState = null;
  document.querySelectorAll('#modeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
}

document.querySelectorAll('#modeToggle button').forEach(b => {
  b.addEventListener('click', () => switchMode(b.dataset.mode));
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ==================== INIT ====================
loadData();
render();
</script>
